[package]
name = "lua"
version = "0.1.0"
description = "Lua - assistente pessoal"
authors = ["Você"]
edition = "2021"

[lib]
name = "lua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
open = "5"
rodio = { version = "0.22", features = ["playback", "symphonia-mp3"] }
once_cell = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dotenvy = "0.15.7"
tauri-plugin-store = "2.5.0"
